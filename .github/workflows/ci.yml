name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src api app tests

      - name: Unit and API tests
        run: pytest -q

      - name: Train on the real dataset
        run: |
          python scripts/download_data.py
          python -m churn.train

      - name: Upload metrics and figures
        uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t churn-api .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api churn-api
          sleep 15
          curl --fail http://localhost:8000/health
